name: qualifyflow
services:
  db:
    image: postgres:18.1
    environment:
      POSTGRES_USER: qualifyflow
      POSTGRES_DB: qualifyflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U qualifyflow]
      interval: 5s
      retries: 15
  redis:
    image: redis:7.4.2-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redisdata:/data]
  mailpit:
    image: axllent/mailpit:v1.24.1
    ports: ['127.0.0.1:8025:8025']
  object-store:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes: [objects:/data]
    ports: ['127.0.0.1:9001:9001']
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://qualifyflow:${POSTGRES_PASSWORD}@db/qualifyflow
      SMTP_HOST: mailpit
      REDIS_URL: redis://redis:6379/0
      PRIVATE_OBJECT_DIR: /var/lib/qualifyflow/evidence
      CLAMAV_HOST: clamav
    command: sh -c 'alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000'
    ports: ['127.0.0.1:8000:8000']
    volumes: [private-evidence:/var/lib/qualifyflow/evidence]
    depends_on:
      db: {condition: service_healthy}
  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://qualifyflow:${POSTGRES_PASSWORD}@db/qualifyflow
      SMTP_HOST: mailpit
      REDIS_URL: redis://redis:6379/0
      PRIVATE_OBJECT_DIR: /var/lib/qualifyflow/evidence
      CLAMAV_HOST: clamav
    command: celery -A app.worker:celery_app worker --beat --loglevel=warning
    volumes: [private-evidence:/var/lib/qualifyflow/evidence]
    depends_on: [api, redis, mailpit]
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ['127.0.0.1:5173:80']
    depends_on: [api]
volumes:
  pgdata:
  redisdata:
  objects:
  private-evidence:
