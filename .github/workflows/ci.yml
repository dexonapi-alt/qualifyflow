name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.1
        env:
          POSTGRES_USER: qualifyflow
          POSTGRES_PASSWORD: ci-synthetic-only
          POSTGRES_DB: qualifyflow_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U qualifyflow" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://qualifyflow:ci-synthetic-only@localhost:5432/qualifyflow_test
      DATABASE_URL: postgresql+psycopg://qualifyflow:ci-synthetic-only@localhost:5432/qualifyflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.13.1'}
      - run: uv sync --project backend --frozen
      - working-directory: backend
        run: |
          .venv/bin/ruff check app tests scripts
          .venv/bin/ruff format --check app tests scripts migrations
          .venv/bin/python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx prettier --check src e2e playwright.config.ts vite.config.ts
  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.1
        env:
          POSTGRES_USER: qualifyflow
          POSTGRES_PASSWORD: ci-synthetic-only
          POSTGRES_DB: qualifyflow_e2e_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U qualifyflow" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://qualifyflow:ci-synthetic-only@localhost:5432/qualifyflow_e2e_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.13.1'}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: uv sync --project backend --frozen
      - run: |
          backend/.venv/bin/python - <<'PY'
          from pathlib import Path
          from cryptography.fernet import Fernet
          Path('.env').write_text('APP_ENV=test\nENCRYPTION_KEY='+Fernet.generate_key().decode()+'\n')
          Path('.local').mkdir(exist_ok=True)
          PY
      - working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - working-directory: backend
        run: |
          .venv/bin/alembic upgrade head
          .venv/bin/python scripts/seed_e2e.py
          .venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../.local/api.log 2>&1 &
          .venv/bin/python scripts/local_mail_sink.py > ../.local/smtp.log 2>&1 &
      - working-directory: frontend
        run: |
          npm run dev > ../.local/web.log 2>&1 &
          curl --retry 20 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:8000/api/v1/health/ready
          curl --retry 20 --retry-connrefused --retry-delay 1 --fail http://localhost:5173/
          npm run test:e2e
