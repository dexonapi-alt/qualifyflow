[project]
name = "qualifyflow-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.121,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.15,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.8,<3",
  "argon2-cffi>=23,<26",
  "pyotp>=2.9,<3",
  "cryptography>=44,<48",
  "email-validator>=2.2,<3",
  "celery[redis]>=5.5,<6",
  "openpyxl>=3.1.5,<4",
  "defusedxml>=0.7.1,<1",
]
[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    "ruff>=0.11,<1",
    "aiosmtpd>=1.4.6",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
